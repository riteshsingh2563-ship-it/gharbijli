<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GharBijli - Google Account Sign-In</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fffaf5;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .brand-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      background: #fff3e0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff6f00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin: 12px 0 6px;
    }
    .status-sub {
      font-size: 13px;
      color: #888;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      margin-top: 18px;
      background: #ff6f00;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(255, 111, 0, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-action:active {
      transform: scale(0.98);
      background: #e65100;
    }
    .btn-action.success {
      background: #2e7d32;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }
    .alert-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: left;
      line-height: 1.4;
      display: none;
    }
    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
  </style>

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="js/config.js"></script>
</head>
<body>

  <div class="auth-card">
    <div class="brand-logo">⚡</div>
    <h1>GharBijli Account Sign-In</h1>
    <p class="subtitle">Secure Google Authentication for GharBijli Mobile App</p>

    <div id="loadingIndicator">
      <div class="spinner"></div>
      <div class="status-text" id="statusMessage">Connecting to Google...</div>
      <div class="status-sub" id="statusSub">Please select your Google Account</div>
    </div>

    <div id="successContent" style="display:none;">
      <div style="font-size:48px; margin: 12px 0;">🎉</div>
      <div class="status-text" id="userNameGreet" style="color:#2e7d32; font-size:18px;">Login Successful!</div>
      <p class="status-sub" style="margin-top:4px;">Returning to your GharBijli App...</p>
      <a id="openAppBtn" class="btn-action success" href="intent://#Intent;package=me.gharbijli.app;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end">
        Tap to Open GharBijli App
      </a>
      <p style="font-size:12px; color:#999; margin-top:12px;">You can also close this tab and switch back to the app.</p>
    </div>

    <div id="manualLoginTrigger" style="display:none;">
      <button id="startGoogleBtn" class="btn-action">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/></svg>
        Sign In with Google
      </button>
    </div>

    <div id="errorAlert" class="alert-box alert-error"></div>
  </div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('sessionId') || urlParams.get('id');

      const statusMsg = document.getElementById('statusMessage');
      const statusSub = document.getElementById('statusSub');
      const loadingIndicator = document.getElementById('loadingIndicator');
      const successContent = document.getElementById('successContent');
      const userNameGreet = document.getElementById('userNameGreet');
      const manualTrigger = document.getElementById('manualLoginTrigger');
      const startGoogleBtn = document.getElementById('startGoogleBtn');
      const errorAlert = document.getElementById('errorAlert');

      function showError(msg) {
        loadingIndicator.style.display = 'none';
        manualTrigger.style.display = 'block';
        errorAlert.style.display = 'block';
        errorAlert.innerText = msg;
      }

      if (!sessionId) {
        showError("Invalid or missing login session ID. Please trigger login from the GharBijli app.");
        return;
      }

      // Initialize Firebase
      if (typeof firebase === 'undefined' || !window.GharBijliConfig || !window.GharBijliConfig.firebase) {
        showError("Authentication configuration failed to load. Please reload.");
        return;
      }

      if (!firebase.apps.length) {
        firebase.initializeApp(window.GharBijliConfig.firebase);
      }
      const auth = firebase.auth();

      async function onAuthSuccess(user) {
        const verifiedUser = {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || (user.email ? user.email.split('@')[0] : "Customer"),
          photoURL: user.photoURL || "",
          phoneNumber: user.phoneNumber || "",
          authProvider: "google"
        };

        statusMsg.innerText = "Saving session...";
        statusSub.innerText = "Syncing with GharBijli app...";

        try {
          const res = await fetch('/api/auth/session/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: sessionId,
              user: verifiedUser
            })
          });
          const json = await res.json();
          if (!json.success) throw new Error(json.error || "Session save failed");

          // Display success
          loadingIndicator.style.display = 'none';
          manualTrigger.style.display = 'none';
          errorAlert.style.display = 'none';
          userNameGreet.innerText = "Welcome, " + verifiedUser.displayName + "!";
          successContent.style.display = 'block';

          // Auto-trigger Android launcher intent
          const appIntent = "intent://#Intent;package=me.gharbijli.app;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end";
          setTimeout(function() {
            window.location.href = appIntent;
          }, 800);

        } catch (err) {
          showError("Session sync error: " + err.message);
        }
      }

      // 1. Check redirect result first
      try {
        const redirectRes = await auth.getRedirectResult();
        if (redirectRes && redirectRes.user) {
          await onAuthSuccess(redirectRes.user);
          return;
        }
      } catch (redirErr) {
        console.warn("Redirect result check:", redirErr.message);
      }

      // 2. Check current user
      if (auth.currentUser) {
        await onAuthSuccess(auth.currentUser);
        return;
      }

      // 3. Initiate Google Sign-In
      async function triggerGoogle() {
        loadingIndicator.style.display = 'block';
        manualTrigger.style.display = 'none';
        errorAlert.style.display = 'none';
        statusMsg.innerText = "Opening Google Account Chooser...";
        statusSub.innerText = "Please select your Google account";

        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        provider.setCustomParameters({ prompt: 'select_account' });

        try {
          // In mobile browser, signInWithPopup works smoothly
          const result = await auth.signInWithPopup(provider);
          if (result && result.user) {
            await onAuthSuccess(result.user);
          }
        } catch (popupErr) {
          console.warn("Popup blocked or error:", popupErr);
          if (popupErr.code === 'auth/unauthorized-domain') {
            showError("Firebase Setup Required: Domain '" + window.location.hostname + "' must be added to Firebase Console -> Authentication -> Settings -> Authorized Domains.");
          } else if (popupErr.code === 'auth/popup-blocked' || popupErr.code === 'auth/popup-closed-by-user') {
            // Fall back to redirect
            statusMsg.innerText = "Redirecting to Google...";
            await auth.signInWithRedirect(provider);
          } else {
            showError("Login failed: " + popupErr.message);
          }
        }
      }

      startGoogleBtn.addEventListener('click', triggerGoogle);

      // Trigger automatically on page load
      triggerGoogle();
    })();
  </script>
</body>
</html>
