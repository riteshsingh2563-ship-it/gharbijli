  <g fill="#ea580c" stroke="#c2410c" stroke-width="1.5">
    <!-- 8 Coil segments -->
    <rect x="29" y="12" width="6" height="8" rx="2" fill="#f97316"/>
    <rect x="29" y="44" width="6" height="8" rx="2" fill="#f97316"/>
    <rect x="12" y="29" width="8" height="6" rx="2" fill="#f97316"/>
    <rect x="44" y="29" width="8" height="6" rx="2" fill="#f97316"/>
    
    <rect x="18" y="18" width="6" height="7" rx="2" transform="rotate(-45 21 21.5)" fill="#ea580c"/>
    <rect x="40" y="18" width="6" height="7" rx="2" transform="rotate(45 43 21.5)" fill="#ea580c"/>
    <rect x="18" y="40" width="6" height="7" rx="2" transform="rotate(45 21 43.5)" fill="#ea580c"/>
