<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GharBijli — Login & OTP Verification</title>
  <link rel="stylesheet" href="../www/css/main.css" />
  <style>
    body { background: #fffaf5; }
    .screen { display: block !important; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-nav">
      <div class="brand-wrapper">
        <img src="../assets/logo.png" alt="GharBijli" class="brand-logo-img" />
      </div>
    </header>

    <main class="screen-container" style="padding: 16px;">
      <div style="text-align: center; margin: 24px 0 20px;">
        <img src="../assets/logo-square.png" alt="GharBijli" style="width: 72px; height: 72px; border-radius: 18px; margin-bottom: 12px; box-shadow: var(--shadow-md);" />
        <h2 style="font-size: 22px; font-weight: 850; letter-spacing: -0.5px;">Welcome to GharBijli</h2>
        <p style="font-size: 13px; color: var(--ink-muted); margin-top: 4px;">Enter your mobile number to book and track electrical services</p>
      </div>

      <!-- Phone Card -->
      <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 16px;">
        <form onsubmit="event.preventDefault(); document.getElementById('step-otp').style.display='block';">
          <div class="form-group">
            <label class="form-label">Mobile Number (मोबाइल नंबर)</label>
            <div class="phone-input-wrap">
              <div class="country-prefix">🇮🇳 +91</div>
              <input type="tel" class="form-control" placeholder="9876543210" maxlength="10" required />
            </div>
            <small style="color: var(--ink-muted); font-size: 11px; margin-top: 6px; display: block;">
              OTP verification via Firebase Phone Authentication
            </small>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
            Get Verification OTP →
          </button>
        </form>
      </div>

      <!-- OTP Card Preview -->
      <div id="step-otp" style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm);">
        <div style="text-align: center; margin-bottom: 12px;">
          <h3 style="font-size: 17px; font-weight: 800;">Verify OTP</h3>
          <p style="font-size: 13px; color: var(--ink-muted); margin-top: 2px;">
            Enter 6-digit code sent to your mobile
          </p>
        </div>

        <div class="otp-container">
          <input type="text" class="otp-digit" maxlength="1" value="1" />
          <input type="text" class="otp-digit" maxlength="1" value="2" />
          <input type="text" class="otp-digit" maxlength="1" value="3" />
          <input type="text" class="otp-digit" maxlength="1" value="4" />
          <input type="text" class="otp-digit" maxlength="1" value="5" />
          <input type="text" class="otp-digit" maxlength="1" value="6" />
        </div>

        <button class="btn btn-primary">
          Verify & Proceed
        </button>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
          <span style="font-size: 12px; color: var(--ink-muted);">Resend in 25s</span>
          <button class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 12px;" disabled>
            Resend OTP
          </button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
