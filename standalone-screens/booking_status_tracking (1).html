<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GharBijli — Booking Status Tracking (Alternate)</title>
  <link rel="stylesheet" href="../www/css/main.css" />
  <style>
    body { background: #fffaf5; }
    .screen { display: block !important; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-nav">
      <div class="brand-wrapper">
        <img src="../assets/logo.png" alt="GharBijli" class="brand-logo-img" />
      </div>
      <a href="my_bookings.html" class="user-status-btn" style="text-decoration:none;">← Back</a>
    </header>

    <main class="screen-container" style="padding: 16px;">
      <!-- Alternate variant with compact step list -->
      <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px;">
        <span class="status-badge badge-pending">Pending Confirmation</span>
        <h3 style="font-size: 18px; font-weight: 850; margin-top: 8px;">Switchboard Fitting & Rewiring</h3>
        <p style="font-size: 12px; color: var(--ink-muted); margin-top: 4px;">Ref: GB-2026-10492</p>
      </div>

      <div style="background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px;">
        <div class="step-row" style="margin-bottom: 16px;">
          <div class="step-number" style="background: #16a34a; color:#fff;">✓</div>
          <div class="step-text"><h5>Request Sent</h5><p>We have your booking details.</p></div>
        </div>
        <div class="step-row" style="margin-bottom: 16px;">
          <div class="step-number" style="background: var(--primary); color:#fff;">2</div>
          <div class="step-text"><h5>Confirmation Call</h5><p>Operator contacting you shortly.</p></div>
        </div>
        <div class="step-row">
          <div class="step-number">3</div>
          <div class="step-text"><h5>Technician Visit</h5><p>Partner visits service address.</p></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
